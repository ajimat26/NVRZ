<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K7N STORE - BUAT AKUN</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#e5e7eb;display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:#1e293b;padding:25px;border-radius:12px;width:100%;max-width:350px;box-shadow:0 4px 10px rgba(0,0,0,0.3);box-sizing:border-box}
h2{text-align:center;margin-top:0;color:#4f46e5}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;box-sizing:border-box;background:#334155;color:white;font-size:14px}
button{width:100%;padding:12px;border:none;border-radius:8px;background:#4f46e5;color:white;cursor:pointer;font-weight:bold;font-size:14px;margin-top:10px}
.token-box{background:#111827;padding:12px;border-radius:8px;margin-top:15px;word-break:break-all;border:1px dashed #4f46e5;display:none}
.token-box p{margin:0 0 5px 0;font-size:12px;color:#94a3b8}
.token-box code{color:#34d399;font-family:monospace;font-size:14px;font-weight:bold}
</style>
</head>
<body>

<div class="card">
  <h2>Buat Akun K7N</h2>
  <input id="username" placeholder="Masukkan Username Admin">
  <input id="password" type="password" placeholder="Masukkan Kata Sandi">
  <button onclick="generateToken()">Buat Kode Login</button>

  <div class="token-box" id="tokenArea">
    <p>🔑 Berikan kode akses ini kepada Admin Anda untuk Login:</p>
    <code id="resultToken"></code>
    <button onclick="salinToken()" style="background:#3b82f6; padding:6px; font-size:12px; margin-top:8px;">Salin Kode</button>
  </div>
</div>

<script>
function generateToken() {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value.trim();

  if(!user || !pass) return alert("Username dan Sandi tidak boleh kosong!");

  // Membuat Token Keamanan dari kombinasi nama dan sandi
  const rawString = user + "||" + pass;
  const encrypted = btoa(rawString); // Encode ke Base64 aman
  const finalToken = "K7N-" + encrypted;

  document.getElementById("resultToken").innerText = finalToken;
  document.getElementById("tokenArea").style.display = "block";
}

function salinToken() {
  const tokenText = document.getElementById("resultToken").innerText;
  navigator.clipboard.writeText(tokenText);
  alert("Kode akses berhasil disalin!");
}
</script>
</body>
</html>
